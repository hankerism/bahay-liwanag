```html
<form
  action="https://formspree.io/f/mrevljnk"
  method="POST">

  <input
    type="hidden"
    name="_next"
    value="https://hankerism.github.io/bahay-liwanag/thank-you.html">

  <label>Full Name</label>
  <input type="text" name="full_name" required>

  <label>Email Address</label>
  <input type="email" name="email" required>

  <label>Phone Number</label>
  <input type="tel" name="phone">

  <label>Check-in Date</label>
  <input type="date" name="check_in">

  <label>Check-out Date</label>
  <input type="date" name="check_out">

  <label>Number of Guests</label>
  <input type="number" name="guests" min="1" value="2">

  <label>Preferred Villa</label>
  <select name="villa">
      <option>No Preference</option>
      <option>Villa Sampaguita</option>
      <option>Villa Narra</option>
      <option>Villa Amihan</option>
  </select>

  <label>Special Requests</label>
  <textarea name="special_requests"></textarea>

  <button type="submit">
      Submit Reservation
  </button>

</form>
```
